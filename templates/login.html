<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
</head>
<body>
    <h1>Log In</h1>
     
    <form id="loginForm">
        <input id="loginUser" type="text" placeholder="Username" required>
        <input id="loginPass" type="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>

    <p id="loginMessage"></p>

    <p>
        Don't have an account?
        <a href="/signup-page">Create account</a>
    </p>

    <p style="margin-top: 15px;">
        <a href="/">Continue without signing in</a>
    </p>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username =
                document.getElementById("loginUser").value.trim();

            const password =
                document.getElementById("loginPass").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const result = await response.json();
                loginMessage.textContent = result.message;

                if (response.ok) {
                    window.location.href = "/";
                }
            } catch (error) {
                console.error(error);
                loginMessage.textContent = "Could not connect to the server.";
            }
        });
    </script>
</body>
</html>
