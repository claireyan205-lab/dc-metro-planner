<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
</head>
<body>
    <h1>Create Account</h1>

    <form id="signupForm">
        <input id="signupUser" type="text" placeholder="Username" required>
        <input id="signupPass" type="password" placeholder="Password" required>
        <button type="submit">Sign Up</button>
    </form>

    <p id="signupMessage"></p>

    <p>
        Already have an account?
        <a href="/login-page">Log in</a>
    </p>

    <p style="margin-top: 15px;">
        <a href="/">Continue without signing in</a>
    </p>

    <script>
        const signupForm = document.getElementById("signupForm");
        const signupMessage = document.getElementById("signupMessage");

        signupForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("signupUser").value.trim();
            const password = document.getElementById("signupPass").value;
            
            try {
                const response = await fetch("/signup", {
                    method: "POST", 
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({username: username, password: password})
                });

                const result = await response.json();
                signupMessage.textContent = result.message;

                if (response.ok) {
                    window.location.href = "/";
                }
            } catch (error) {
                console.error(error);
                signupMessage.textContent = "Could not connect to server."
            }
        });
    </script>
</body>
</html>
